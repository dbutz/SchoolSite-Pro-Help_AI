// Apply release metadata to both the static shell and route-generated markup.
function syncReleaseLabels() {
  document.querySelectorAll('[data-app-build]').forEach(element => {
    element.textContent = RELEASE.version;
  });

  document.querySelectorAll('[data-app-release-date]').forEach(element => {
    element.textContent = RELEASE.releaseDate;
  });
}

syncReleaseLabels();

// Keeps navigation shareable through the URL and handles repeat clicks on the current route.
function route(name, id){
  const nextHash = name === 'doc' && id ? `#doc/${id}` : `#${name}`;
  if (location.hash === nextHash) {
    renderRoute();
    return;
  }
  location.hash = nextHash;
}
// Renders the page selected by the URL and synchronizes navigation state.
function renderRoute(){
  if (homeTourTimer !== null) {
    clearInterval(homeTourTimer);
    homeTourTimer = null;
  }
  const parts=location.hash.replace(/^#/,'').split('/');
  const page=parts[0]||'home', id=parts[1];
  document.querySelectorAll('#desktopNav button').forEach(b=>b.classList.toggle('active',b.dataset.route===page || (page==='doc'&&b.dataset.route==='docs')));
  if(page==='doc' && id) renderDoc(id);
  else if(page==='docs') renderDocs();
  else if(page==='toolkit') renderToolkit();
  else if(page==='download') renderDownload();
  else renderHome();
  renderSidebar(page,id);
  syncReleaseLabels();
  window.scrollTo(0,0);
}
// Builds the sidebar for the current page and marks its active destination.
function renderSidebar(page,id){
  const s=document.getElementById('sidebar');
  if(page==='docs'||page==='doc'){
    s.innerHTML=`<div class="side-search">
      <label class="side-search-label" for="headerSearch">Search documents</label>
      <div class="side-search-field">
        <span aria-hidden="true">⌕</span>
        <input id="headerSearch" type="search" placeholder="Search documents..." autocomplete="off" oninput="searchDocuments(this.value)" onkeydown="handleHeaderSearchKey(event)">
      </div>
    </div>` + [...sections].sort((a,b)=>{
      if (a === 'Start here') return -1;
      if (b === 'Start here') return 1;
      if (a === 'FAQ') return 1;
      if (b === 'FAQ') return -1;
      return a.localeCompare(b);
    }).map((sec,index)=>{
      const items=docs
        .filter(d=>d.section===sec)
        .sort((a,b)=>a.title.localeCompare(b.title));
      const activeInGroup = items.some(d => d.id === id);
      const openByDefault = !id && index === 0;
      return `<details class="side-group" ${activeInGroup || openByDefault ? 'open' : ''}>
        <summary class="side-section">${sec}</summary>
        <div class="side-links">${items.map(d=>`<button class="side-link ${d.id===id?'active':''}" onclick="route('doc','${d.id}')">${d.title}</button>`).join('')}</div>
      </details>`;
    }).join('');

  } else if(page==='toolkit') {
    const categories = toolCategories();
    s.innerHTML = `<div class="side-search toolkit-side-search">
      <label class="side-search-label" for="toolSearch">Search tools</label>
      <div class="side-search-field">
        <span aria-hidden="true">⌕</span>
        <input id="toolSearch" type="search" placeholder="Search tools..." autocomplete="off" oninput="activeToolIndex = null; filterTools(this.value)">
      </div>
    </div>` + categories.map((category,index) => {
      const items = (category === 'All'
        ? tools
        : tools.filter(tool => toolCategory(tool) === category))
        .slice()
        .sort((a,b)=>a.name.localeCompare(b.name));
      const openByDefault = activeToolCat === category || (!activeToolCat && index === 0);
      return `<details class="side-group" data-tool-category="${escapeHtml(category)}" ${openByDefault ? 'open' : ''}>
        <summary class="side-section" onclick='selectToolCategory(${JSON.stringify(category)})'>${escapeHtml(toolGroupLabel(category))}</summary>
        <div class="side-links">${items.map((tool) => {
          const toolIndex = tools.indexOf(tool);
          return `<button class="side-link" onclick="selectTool(${toolIndex})">${escapeHtml(tool.name)}</button>`;
        }).join('')}</div>
      </details>`;
    }).join('');
    const toolSearch = document.getElementById('toolSearch');
    if (toolSearch) toolSearch.value = '';
    filterTools('');
  } else {
    s.innerHTML=`
      <button class="side-link ${page==='home'?'active':''}" onclick="route('home')">Overview</button>
      <button class="side-link" onclick="route('docs')">Documentation</button>
      <button class="side-link" onclick="route('toolkit')">Toolkit</button>
      <button class="side-link" onclick="route('download')">Download</button>`;
  }
}

// Converts structured article content to searchable plain text.
function articleContentText(content) {
  if (Array.isArray(content)) {
    return content.map(item => articleContentText(item)).join(' ');
  }

  if (content && typeof content === 'object') {
    if (content.type === 'image') {
      return [content.alt || '', content.caption || '', content.src || ''].join(' ');
    }

    if (content.type === 'table') {
      const rows = content.rows || [];
      return rows.flat().map(item => articleContentText(item)).join(' ');
    }

    if (content.type === 'list' || content.type === 'steps' || content.type === 'ordered') {
      return (content.items || []).map(item => articleContentText(item)).join(' ');
    }

    if (content.blocks) {
      return content.blocks.map(item => articleContentText(item)).join(' ');
    }

    if (content.items) {
      return content.items.map(item => articleContentText(item)).join(' ');
    }

    if (content.text) {
      return String(content.text || '');
    }

    return Object.values(content).map(item => articleContentText(item)).join(' ');
  }

  return String(content || '');
}

// Detects legacy text blocks that should be displayed as lists.
function looksLikeListText(text) {
  return /(?:^|\n)\s*(?:[-*•]|\d+\.)\s+/m.test(text);
}

// Splits legacy bullet or numbered text into individual list entries.
function parseListText(text) {
  return text
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      const match = line.match(/^(?:[-*•]|\d+\.)\s+(.*)$/);
      return match ? match[1].trim() : line;
    })
    .filter(Boolean);
}

// Normalizes strings and legacy content objects into a display label.
function resolveTextValue(value) {
  if (value == null) return '';
  if (typeof value === 'string') return value.trim();
  if (Array.isArray(value)) return value.map(resolveTextValue).filter(Boolean).join(' ');
  if (typeof value === 'object') {
    if (value.text) return resolveTextValue(value.text);
    if (value.label) return resolveTextValue(value.label);
    if (value.title) return resolveTextValue(value.title);
    return Object.values(value).map(resolveTextValue).filter(Boolean).join(' ');
  }
  return String(value).trim();
}

// Escapes content while converting the supported inline emphasis markers.
function formatInlineRichText(value) {
  const text = String(value ?? '');

  if (!text) {
    return '';
  }

  const parts = text.split(/(\*\*[^*]+\*\*|__[^_]+__)/g).filter(Boolean);
  const formatted = parts.map(part => {
    const match = part.match(/^\*\*(.+)\*\*$|^__(.+)__$|^(.+)$/);

    if (match) {
      const strongValue = match[1] ?? match[2];

      if (strongValue !== undefined) {
        return `<strong>${escapeHtml(strongValue)}</strong>`;
      }
    }

    return escapeHtml(part);
  }).join('');

  return formatted
    .replace(/"([^"]+)"/g, '“$1”')
    .replace(/'([^']+)'/g, '‘$1’');
}

// Renders plain, linked, and nested items using the same list rules.
function renderListItem(item, ordered) {
  if (typeof item === 'string') {
    return `<li>${formatInlineRichText(item.trim())}</li>`;
  }

  if (Array.isArray(item)) {
    return item.map(part => renderListItem(part, ordered)).join('');
  }

  if (item && typeof item === 'object') {
    const textValue = resolveTextValue(item);
    const labelText = textValue && textValue !== '[object Object]' ? textValue : 'Item';
    const label = item.href
      ? `<a href="${escapeHtml(item.href)}" onclick="${escapeHtml(item.onClick || '')}">${formatInlineRichText(labelText)}</a>`
      : formatInlineRichText(labelText);
    const children = item.subitems || item.items || item.children || [];
    const nested = children.length ? `<${ordered ? 'ol' : 'ul'}>${children.map(child => renderListItem(child, item.ordered || ordered)).join('')}</${ordered ? 'ol' : 'ul'}>` : '';
    return `<li>${label}${nested}</li>`;
  }

  const safe = resolveTextValue(item);
  return `<li>${formatInlineRichText(safe || 'Item')}</li>`;
}

// Distinguishes short section labels from sentences in legacy article content.
function isArticleHeadingText(text) {
  const value = (text || '').trim();

  if (!value || value.length > 90) {
    return false;
  }

  if (/[.!?]/.test(value)) {
    return false;
  }

  return !/^\s*[-*•]\s+/.test(value);
}

// Renders supported content blocks consistently across articles, tools, and notes.
function renderStructuredBlock(block) {
  if (Array.isArray(block)) {
    return block.map(item => renderStructuredBlock(item)).join('');
  }

  if (typeof block === 'string') {
    const trimmed = block.trim();
    if (!trimmed) {
      return '';
    }
    if (looksLikeListText(trimmed)) {
      return `<ul>${parseListText(trimmed).map(item => renderListItem(item, false)).join('')}</ul>`;
    }
    return `<p>${formatInlineRichText(trimmed)}</p>`;
  }

  if (!block || typeof block !== 'object') {
    return '';
  }

  if (block.href && (block.text || block.content)) {
    const text = block.text || block.content;
    return `<p><a href="${escapeHtml(block.href)}" onclick="${escapeHtml(block.onClick || '')}">${formatInlineRichText(text)}</a></p>`;
  }

  if (block.type === 'image') {
    return `<figure class="article-image"><img src="${escapeHtml(block.src || '')}" alt="${escapeHtml(block.alt || '')}"><figcaption>${escapeHtml(block.caption || '')}</figcaption></figure>`;
  }

  if (block.type === 'heading' || block.type === 'subheading') {
    const tag = block.type === 'heading' ? 'h3' : 'h4';
    return `<${tag}>${formatInlineRichText(block.text || block.content || block.title || '')}</${tag}>`;
  }

  if (block.type === 'bullet' || block.type === 'bullets') {
    const items = block.items || block.bullets || [];
    return `<ul>${items.map(item => renderListItem(item, false)).join('')}</ul>`;
  }

  if (block.type === 'table') {
    const headers = block.headers || [];
    const rows = block.rows || [];
    const headerHtml = headers.length ? `<thead><tr>${headers.map(h => `<th>${escapeHtml(String(h))}</th>`).join('')}</tr></thead>` : '';
    const bodyHtml = rows.length ? `<tbody>${rows.map(row => `<tr>${(row || []).map(cell => `<td>${escapeHtml(String(cell ?? ''))}</td>`).join('')}</tr>`).join('')}</tbody>` : '';
    return `<table class="article-table">${headerHtml}${bodyHtml}</table>`;
  }

  if (block.type === 'paragraph' || block.text) {
    const text = block.text || block.content || '';
    if (isArticleHeadingText(text)) {
      return `<p><strong>${formatInlineRichText(text)}</strong></p>`;
    }
    return `<p>${formatInlineRichText(text)}</p>`;
  }

  if (block.type === 'list' || block.type === 'steps' || block.type === 'ordered' || block.items) {
    const ordered = block.type === 'steps' || block.type === 'ordered' || block.ordered;
    const items = block.items || [];
    return `<${ordered ? 'ol' : 'ul'}>${items.map(item => renderListItem(item, ordered)).join('')}</${ordered ? 'ol' : 'ul'}>`;
  }

  if (block.type === 'section' || block.blocks) {
    return (block.blocks || []).map(item => renderStructuredBlock(item)).join('');
  }

  return '';
}

// Groups a heading and its rendered blocks into one article section.
function renderArticleSection(heading, content) {
  const items = Array.isArray(content) ? content : [content];
  const sectionContent = items.map(item => renderStructuredBlock(item)).filter(Boolean).join('');

  if (!sectionContent) {
    return '';
  }

  return `<section>${heading ? `<h2>${escapeHtml(heading)}</h2>` : ''}${sectionContent}</section>`;
}

// Ranks document matches so titles and sections appear before body-only matches.
function filterDocs(q){
 const query = q.trim().toLowerCase();
 const list = docs.map(d => {
   const title = d.title.toLowerCase();
   const section = d.section.toLowerCase();
   const summary = d.summary.toLowerCase();
   const body = Array.isArray(d.body) ? d.body.map(x=>articleContentText(x[1])).join(' ').toLowerCase() : '';
   const text = `${title} ${summary} ${section} ${body}`;
   let score = -1;
   if (!query) score = 0;
   else if (title === query) score = 0;
   else if (title.startsWith(query)) score = 1;
   else if (section.startsWith(query)) score = 2;
   else if (title.includes(query)) score = 3;
   else if (summary.includes(query)) score = 4;
   else if (text.includes(query)) score = 5;
   return { doc: d, score };
 }).filter(item => item.score >= 0).sort((a,b) => a.score - b.score).map(item => item.doc);
 const resultNote = query ? `<div class="doc-results-note">${list.length} suggestion${list.length === 1 ? '' : 's'} for <strong>${escapeHtml(q.trim())}</strong></div>` : '';
 document.getElementById('docList').innerHTML = resultNote + (list.map(d=>`<button class="doc-row" onclick="route('doc','${d.id}')"><div><span class="doc-section">${d.section}</span><h3>${d.title}</h3><p>${d.summary}</p></div><span>→</span></button>`).join('') || '<div class="empty">No documentation matched your search.</div>');
}

// Supplies a stable fallback category for tools without category metadata.
function toolCategory(tool) {

    return tool &&
           tool.category &&
           tool.category.trim()
        ? tool.category.trim()
  : "Other Tools";
}

   --------------------------------------------------------- */

// Applies category and text filters, then renders matching tool cards.
function filterTools(search = "") {

    const grid = document.getElementById("toolGrid");
    const count = document.getElementById("toolCount");

    if (!grid || !count) return;

    search = search.trim().toLowerCase();

    const filtered = tools.filter(tool => {

        const category =
            toolCategory(tool);

        const categoryMatch =
          activeToolCat === "All" ||
          category === activeToolCat;

        const toolMatch =
          activeToolIndex === null ||
          tools.indexOf(tool) === activeToolIndex;

        if (!categoryMatch || !toolMatch) return false;

        if (!search) return true;

        const text = [
            tool.name,
            category,
            tool.desc,
          articleContentText(tool.content || tool.details)
        ]
        .join(" ")
        .toLowerCase();

        return text.includes(search);
    });

    if (search) {
      filtered.sort((a, b) => {
        const score = tool => {
          const name = tool.name.toLowerCase();
          const category = toolCategory(tool).toLowerCase();
          if (name === search) return 0;
          if (name.startsWith(search)) return 1;
          if (category.startsWith(search)) return 2;
          return 3;
        };
        return score(a) - score(b);
      });
    }

    const scopeLabel = activeToolIndex !== null
      ? tools[activeToolIndex].name
      : search ? `matches for "${search}"` : activeToolCat === "All" ? "all tools" : activeToolCat;

    const toolLabel = filtered.length === 1 ? "tool" : "tools";

    count.textContent =
      `${filtered.length} ${toolLabel} · ${scopeLabel}`;

    if (!filtered.length) {

        grid.innerHTML = `
            <div class="empty">
                <strong>No tools found</strong>
                <p>
                    Try another search term
                    or choose a different
                    category.
                </p>
            </div>
        `;

        return;
    }

    grid.innerHTML =
        filtered.map(tool => {

            const index =
                tools.indexOf(tool);

            return `
                <button
                    class="tool-card"
                    onclick="openTool(${index})">

                  <img src="assets/images/tool-icon.svg" alt="">

                    <div class="tool-card-content">

                        <span class="tool-category">
                          ${escapeHtml(toolCategory(tool))}
                        </span>

                        <h3>${escapeHtml(tool.name)}</h3>

                        <p>${escapeHtml(tool.desc)}</p>

                    </div>

                </button>
            `;

        }).join("");
}

/* Search the local documentation and toolkit from the Ctrl/Cmd + K palette. */
function buildSearchHits(q) {
  q = (q || '').trim();
  if (!q) return [];

  const query = q.toLowerCase();
  const hits = [];

  docs.forEach(d => {
    const text = (
      d.title + ' ' +
      d.summary + ' ' +
      d.section + ' ' +
      d.body.map(item => `${item[0]} ${articleContentText(item[1])}`).join(' ')
    ).toLowerCase();

    if (text.includes(query)) {
      hits.push({
        type: 'Documentation',
        title: d.title,
        meta: d.section,
        action: () => { closeSearch(); route('doc', d.id); }
      });
    }
  });

  tools.forEach((t, i) => {
    const text = (
      t.name + ' ' +
      t.desc + ' ' +
      (t.details || '')
    ).toLowerCase();

    if (text.includes(query)) {
      hits.push({
        type: 'Tool',
        title: t.name,
        meta: toolCategory(t),
        action: () => {
          closeSearch();
          route('toolkit');
          setTimeout(() => { openTool(i); }, 50);
        }
      });
    }
  });

  return hits;
}

// Displays global search results and connects each result to its action.
function renderSearch(q) {
  const results = document.getElementById('searchResults');
  if (!results) return;

  q = (q || '').trim();

  if (!q) {
    results.innerHTML = '<div class="search-empty"></div>';
    return;
  }
  const hits = buildSearchHits(q);

  if (!hits.length) {
    results.innerHTML = `<div class="search-empty">No documentation or tools found for <strong>${escapeHtml(q)}</strong></div>`;
    return;
  }

  results.innerHTML = hits.slice(0, 20).map((h, i) => `
    <button class="search-result" data-search-index="${i}">
      <span class="search-result-type">${h.type}</span>
      <span class="search-result-content">
        <strong>${escapeHtml(h.title)}</strong>
        <small>${escapeHtml(h.meta)}</small>
      </span>
      <span class="search-result-arrow">→</span>
    </button>
  `).join('');

  results.querySelectorAll('.search-result').forEach((button, index) => {
    button.onclick = () => { if (hits[index]) hits[index].action(); };
  });
}

}

// Prevents content values from being interpreted as HTML when rendered.
function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}
